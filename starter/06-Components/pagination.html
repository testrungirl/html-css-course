<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pagination.css" />
    <title>Pagination</title>
  </head>
  <body>
    <div class="container">
      <button
        class="btn-left"
        type="button"
        title="Toggle content visibility"
      >
        &lt;
      </button>
      
      <a href="#" class="pagination">1</a>
      <a href="#" class="pagination">2</a>
      <a href="#" class="pagination current">3</a>
      <a href="#" class="pagination">4</a>
      <a href="#" class="pagination">5</a>
      <a href="#" class="pagination">6</a>
      <a href="#" class="pagination">...</a>
      <a href="#" class="pagination">23</a>
      <button
        class="btn-right"
        type="button"
        title="Toggle content visibility"
      >
        &gt;
      </button>
    </div>
  </body>
</html>
